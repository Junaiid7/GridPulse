[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridpulse"
version = "2.0.0"
description = "Uncertainty-aware residual-load forecasting and storage dispatch optimisation for the Dutch electricity market."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["energy", "forecasting", "uncertainty", "optimisation", "storage", "netherlands"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
# Phase 3 requires tzdata for zoneinfo.ZoneInfo on Windows (no system tz db).
# Phase 4C adds LightGBM for quantile (probabilistic) regression; numpy/scipy
# come in transitively as LightGBM's own requirements.
# Phase 4D-A uses scipy.optimize.linprog (HiGHS) for battery dispatch; it is
# declared directly because it is an import-time requirement, not incidental.
dependencies = ["tzdata>=2024.1", "lightgbm>=4.7.0", "scipy>=1.13"]

[project.optional-dependencies]
# Minimum set required to run the test suite. Broader stack (Prefect, DuckDB,
# LightGBM, etc.) is intentionally deferred to later phases.
dev = ["pytest>=8.0", "ruff>=0.2.0"]
serving = ["fastapi>=0.110", "uvicorn>=0.25"]
dashboard = ["streamlit>=1.30", "plotly>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/gridpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Let pytest import the src-layout package without a prior install.
pythonpath = ["src"]